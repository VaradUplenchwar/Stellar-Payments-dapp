<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An infinite canvas app for visual thinking, note-taking, and idea mapping. Create cards, draw connections, and organize thoughts on a limitless workspace.">
  <title>Infinite Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/connections.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/minimap.css">
</head>
<body>
  <div id="app">
    <canvas id="grid-canvas"></canvas>
    <div id="canvas-viewport">
      <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="groups-layer"></div>
      <div id="cards-layer"></div>
    </div>
    <div id="toolbar"></div>
    <div id="zoom-controls"></div>
    <canvas id="minimap"></canvas>
    <div id="context-menu" class="hidden"></div>
  </div>

  <script src="js/canvas.js"></script>
  <script src="js/history.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/connections.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/toolbar.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
